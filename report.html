<script>
window.addEventListener('DOMContentLoaded', () => {
  const doc = document.getElementById('doc');
  fetch('report.md').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(md => {
    if (window.marked) {
      doc.innerHTML = marked.parse(md);
      doc.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    } else {
      const pre = document.createElement('pre'); pre.style.whiteSpace = 'pre-wrap'; pre.textContent = md; doc.replaceChildren(pre);
    }
  }).catch(() => { doc.innerHTML = '<p class="note">The report could not be loaded. Check your connection and try again.</p>'; });
});
</script>
