<script>
/* The report in the chosen language (report.zh.md, report.ms.md), falling back to English with a note. */
window.addEventListener('DOMContentLoaded', () => {
  const doc = document.getElementById('doc');
  const note = document.getElementById('report-lang');
  const t = k => (window.I18N ? window.I18N.t(k) : k);
  if (window.marked) marked.use({renderer: {html: () => ''}});
  const get = f => fetch(f).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
  function show(md, lang) {
    doc.lang = lang === 'zh' ? 'zh-Hans' : lang;
    if (!window.marked) {
      const pre = document.createElement('pre'); pre.style.whiteSpace = 'pre-wrap'; pre.textContent = md; doc.replaceChildren(pre); return;
    }
    /* Raw HTML in the markdown is dropped, and only web, mail and in-page links are kept. */
    doc.innerHTML = marked.parse(md);
    doc.querySelectorAll('a[href]').forEach(a => { if (!/^(https?:|mailto:|#|\.?\/|[\w-]+\.(html|md))/i.test(a.getAttribute('href'))) a.removeAttribute('href'); });
    doc.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  }
  function load() {
    const lang = window.I18N ? window.I18N.lang : 'en';
    note.hidden = true;
    (lang === 'en' ? Promise.reject(new Error('en')) : get(`report.${lang}.md`).then(md => show(md, lang)))
      .catch(() => get('report.md').then(md => {
        show(md, 'en');
        if (lang !== 'en') { note.textContent = t('report.only'); note.hidden = false; }
      }))
      .catch(() => {
        const p = document.createElement('p'); p.className = 'note'; p.textContent = t('report.fail'); doc.replaceChildren(p);
      });
  }
  load();
  window.addEventListener('langchange', load);
});
</script>
